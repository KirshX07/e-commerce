<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var activeFetch = origFetch ? function() {
            return origFetch.apply(window, arguments);
          } : undefined;

          // Define getter and setter on window to prevent "Cannot set property fetch which has only a getter"
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                activeFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {
            try {
              var proto = Object.getPrototypeOf(window);
              if (proto) {
                Object.defineProperty(proto, 'fetch', {
                  get: function() {
                    return activeFetch;
                  },
                  set: function(fn) {
                    activeFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e2) {}
          }
        } catch (err) {}
      })();
    </script>
